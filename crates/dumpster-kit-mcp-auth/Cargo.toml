[package]
name = "dumpster-kit-mcp-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OAuth resource server for a dumpster site's /mcp: RFC 9728 metadata, Pocket ID access-token validation (JWKS, iss, aud, exp), group gate and tenant resolution"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "net"] }
dumpster-kit-oidc = { path = "../dumpster-kit-oidc" }
dumpster-kit-tenancy = { path = "../dumpster-kit-tenancy" }
dumpster-kit-telemetry = { path = "../dumpster-kit-telemetry" }
url = "2"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
dumpster-kit-oidc = { path = "../dumpster-kit-oidc", features = ["testing"] }
dumpster-kit-tenancy = { path = "../dumpster-kit-tenancy", features = ["testing"] }
