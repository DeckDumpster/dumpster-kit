[package]
name = "dumpster-kit-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Game-agnostic catalog machinery: the Game trait, raw landing and payload ledger, idempotent apply job, single-owner shared.sqlite with (game, schema_version) rebuild, alarms and sync_state"

[dependencies]
