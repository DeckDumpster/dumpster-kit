[package]
name = "dumpster-kit-oidc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "OIDC sign-in for the dumpster sites: authorization code + PKCE against Pocket ID, ID-token verification, groups allow rule, signed session cookie"

[features]
# A fake OIDC provider (discovery, JWKS with rotation, token endpoint checking PKCE) that mints
# ID tokens, for a consumer's own tests.
testing = ["dep:rsa"]

[dependencies]
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "net"] }
rsa = { version = "0.9", features = ["pem"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rsa = { version = "0.9", features = ["pem"] }
tower = { version = "0.5", features = ["util"] }
dumpster-kit-oidc = { path = ".", features = ["testing"] }
