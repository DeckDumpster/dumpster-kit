[package]
name = "dumpster-kit-tenancy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tenancy kernel: handle/ULID validators, user registry, the one tenant connection opener, Cloudflare Access verification and tenant resolution"

[features]
# The in-process RS256 JWKS server, token minters (valid and every entry of the negative-JWT
# corpus) and the test-only constructors a consumer's own tests need.
testing = ["dep:rsa", "dep:base64", "dep:tempfile"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
chrono = "0.4"
ulid = { version = "3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["sync", "rt", "macros", "net"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["pem"], optional = true }
base64 = { version = "0.22", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
dumpster-kit-conformance = { path = "../dumpster-kit-conformance" }
tempfile = "3"
rsa = { version = "0.9", features = ["pem"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
