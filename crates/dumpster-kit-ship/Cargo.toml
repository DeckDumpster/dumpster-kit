[package]
name = "dumpster-kit-ship"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "The shipper: ownership outbox -> tenant zone, resumable, gap-detecting; and the zone read back"

[dependencies]
dumpster-kit-keys = { workspace = true }
dumpster-kit-lake = { workspace = true }
dumpster-kit-tenancy = { workspace = true }
aes-gcm = "0.11"
bytes = "1"
chrono = "0.4"
hex = "0.4"
parquet = { version = "59", default-features = false, features = ["zstd"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
