[package]
name = "dumpster-kit-keys"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Key custody for the tenant zone: one master key file, HKDF per-tenant keys, a tombstone registry, separate backup and destruction paths"

[dependencies]
dumpster-kit-tenancy = { workspace = true }
thiserror = "2"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hkdf = "0.12"
getrandom = "0.3"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
