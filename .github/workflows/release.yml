name: Release

# A release tag (v*) publishes every dumpster-kit-* crate to the tailnet Cargo registry (Gitea),
# and only after the whole of ci.yml (gate and both canaries) passes on the tagged commit.
# An ordinary merge publishes nothing. The registry is on the tailnet, so publish joins it from a
# GitHub-hosted runner with the org TS_OAUTH secrets (never the prod host's deploy runner).
# workflow_dispatch is a dry run: it joins the tailnet, checks the registry and runs
# `cargo publish --dry-run`, and publishes nothing.
# Procedure and semver policy: README "Releases".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # The registry answers on the tailnet only: join it as an ephemeral node. Never the prod host.
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - if: github.event_name == 'push'
        run: scripts/release-check.sh "$GITHUB_REF_NAME"
      - run: scripts/registry-check.sh
      - run: cargo publish --workspace --dry-run --registry tailnet --no-verify
        env:
          CARGO_REGISTRIES_TAILNET_TOKEN: ${{ secrets.GITEA_CARGO_TOKEN }}
      - if: github.event_name == 'push'
        run: cargo publish --workspace --registry tailnet
        env:
          CARGO_REGISTRIES_TAILNET_TOKEN: ${{ secrets.GITEA_CARGO_TOKEN }}
