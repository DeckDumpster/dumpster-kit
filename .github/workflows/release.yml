name: Release

# A release tag (v*) publishes every dumpster-kit-* crate to the tailnet Cargo registry (Gitea),
# and only after the whole of ci.yml (gate and both canaries) passes on the tagged commit.
# An ordinary merge publishes nothing. The registry is on the tailnet, so publish runs on the
# self-hosted runner that has joined it. Procedure and semver policy: README "Releases".

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    runs-on: [self-hosted, deploy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release-check.sh "$GITHUB_REF_NAME"
      - run: cargo publish --workspace --registry tailnet
        env:
          CARGO_REGISTRIES_TAILNET_TOKEN: ${{ secrets.TAILNET_CARGO_TOKEN }}
