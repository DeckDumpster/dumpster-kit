# Declared configuration of the product metrics stack. Sourced by install.sh.
PRODUCT_HOST=ubuntu-mini-0
# Hostname as seen by tailscale; Grafana binds to this node's tailnet address only.
VM_IMAGE=docker.io/victoriametrics/victoria-metrics:v1.131.0@sha256:97448e1cc7751c27d068dd8d1a1a2a3e0c1bd50c4a160d444eb0566716b20eb4
GRAFANA_IMAGE=docker.io/grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
VM_RETENTION=90d
VM_CPU_QUOTA=100%
GRAFANA_CPU_QUOTA=100%
# VictoriaMetrics binds the tailnet address on this port (not 127.0.0.1) so the sites' podman
# containers on this host can push OTLP to it; the tailnet address is host-local to them.
# Sites push to http://ubuntu-mini-0.tailb4a728.ts.net:8428/opentelemetry/v1/metrics
VM_PORT=8428
# 3000 is Gitea (brain's origin) on this host; 3001 was free per `ss -ltn` on 2026-10-20.
GRAFANA_PORT=3001
# Dashboard directories, one per repo: name=path. Each is mounted read-only and
# provisioned as its own folder. Missing paths are skipped with a warning.
DASHBOARDS="dumpster-kit=@KIT@/deploy/dashboards pokedumpster=$HOME/pokedumpster/deploy/dashboards dumpstar=$HOME/dumpstar/deploy/dashboards deckdumpster=/opt/mtgc-prod/deploy/dashboards"
