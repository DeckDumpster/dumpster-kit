# Declared configuration of the product metrics stack. Sourced by install.sh.
PRODUCT_HOST=ubuntu-mini-0
# Hostname as seen by tailscale; Grafana binds to this node's tailnet address only.
VM_IMAGE=docker.io/victoriametrics/victoria-metrics:v1.131.0@sha256:97448e1cc7751c27d068dd8d1a1a2a3e0c1bd50c4a160d444eb0566716b20eb4
GRAFANA_IMAGE=docker.io/grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
VM_RETENTION=90d
VM_CPU_QUOTA=100%
GRAFANA_CPU_QUOTA=100%
# VictoriaMetrics binds the tailnet address on this port (not 127.0.0.1) so the sites' podman
# containers on this host can push OTLP to it; the tailnet address is host-local to them.
# Sites push to http://ubuntu-mini-0.tailb4a728.ts.net:8428/opentelemetry/v1/metrics
VM_PORT=8428
# 3000 is Gitea (brain's origin) on this host; 3001 was free per `ss -ltn` on 2026-10-20.
GRAFANA_PORT=3001
# Dashboard directories, one per repo: name=path. Each is mounted read-only and
# provisioned as its own folder. Missing paths are skipped with a warning.
DASHBOARDS="dumpster-kit=@KIT@/deploy/dashboards pokedumpster=$HOME/pokedumpster/deploy/dashboards dumpstar=$HOME/dumpstar/deploy/dashboards deckdumpster=/opt/mtgc-prod/deploy/dashboards remarkable-pipeline=$HOME/.local/share/remarkable-pipeline/dashboards"
# Who may see what on the product Grafana (words are -e KEY=value for the container; no spaces in a value).
# Tests export GRAFANA_ACCESS_ENV= (empty) to prove install.sh refuses, hence the ${VAR-default} form.
#  GF_AUTH_ANONYMOUS_ENABLED=true     a visitor with no session is served as anonymous.
#  GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer  that visitor can view dashboards only: no dashboards:write,
#                                     no datasources:read, no admin, user or org permissions.
#  GF_USERS_VIEWERS_CAN_EDIT=false    Viewers cannot edit in the UI or use Explore.
#  GF_AUTH_DISABLE_LOGIN_FORM=false   the admin login form stays reachable.
#  GF_AUTH_ANONYMOUS_HIDE_VERSION=true  the Grafana version is not shown to anonymous visitors.
# GF_AUTH_ANONYMOUS_ORG_NAME is deliberately not set: Grafana's default is "Main Org.", the only org here,
# and the value's space and dot would break this word list.
# Dashboards are also read-only for everyone, admin included: they are file-provisioned with allowUiUpdates: false.
GRAFANA_ACCESS_ENV=${GRAFANA_ACCESS_ENV-"GF_AUTH_ANONYMOUS_ENABLED=true GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer GF_USERS_VIEWERS_CAN_EDIT=false GF_AUTH_DISABLE_LOGIN_FORM=false GF_AUTH_ANONYMOUS_HIDE_VERSION=true"}
